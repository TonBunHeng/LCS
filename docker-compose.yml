services:
  # ----------------------------------------------------------------------------
  # Apache HTTP Server
  # ----------------------------------------------------------------------------
  apache:
    build:
      context: ./docker/apache
      args:
        PUID: ${PUID:-501}
        PGID: ${PGID:-20}
    container_name: localdev_apache
    restart: unless-stopped
    ports:
      - "${APACHE_PORT:-80}:80"
    environment:
      DOMAIN_SUFFIX: ${DOMAIN_SUFFIX:-local}
      DEFAULT_PHP_VERSION: ${DEFAULT_PHP_VERSION:-8.5}
      DEFAULT_PHP_SERVICE: ${DEFAULT_PHP_SERVICE:-php:9000}
      MYSQL_PORT: ${MYSQL_PORT:-3307}
      MARIADB_PORT: ${MARIADB_PORT:-3308}
      POSTGRES_PORT: ${POSTGRES_PORT:-5433}
      REDIS_PORT: ${REDIS_PORT:-6379}
      PHPMYADMIN_PORT: ${PHPMYADMIN_PORT:-8081}
    volumes:
      - ./htdocs:/var/www/html
      - ./docker/apache/dashboard:/var/www/dashboard:ro
      - ./docker/apache/scripts:/scripts
      - ./docker/apache/vhosts:/etc/apache2/vhosts.d
      - ./logs/apache:/var/log/apache2
    depends_on:
      - php
    networks:
      - localdev_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # PHP 8.5+ FastCGI (Latest)
  # ----------------------------------------------------------------------------
  php:
    build:
      context: ./docker/php
      args:
        PUID: ${PUID:-501}
        PGID: ${PGID:-20}
    container_name: localdev_php
    restart: unless-stopped
    volumes:
      - ./htdocs:/var/www/html
      - ./docker/apache/dashboard:/var/www/dashboard:ro
      - ./logs/php:/var/log/php
    environment:
      DB_HOST_MYSQL: mysql
      DB_HOST_MARIADB: mariadb
      DB_HOST_POSTGRES: postgresql
      REDIS_HOST: redis
    networks:
      - localdev_net

  # ----------------------------------------------------------------------------
  # MySQL 8.x
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: localdev_mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-localdev_mysql}
      MYSQL_USER: ${MYSQL_USER:-devuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpass}
    volumes:
      - ./databases/mysql:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./logs/mysql:/var/log/mysql
    networks:
      - localdev_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # MariaDB 11.x
  # ----------------------------------------------------------------------------
  mariadb:
    image: mariadb:11.4
    container_name: localdev_mariadb
    restart: unless-stopped
    ports:
      - "${MARIADB_PORT:-3308}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-localdev_mariadb}
      MARIADB_USER: ${MARIADB_USER:-devuser}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-devpass}
    volumes:
      - ./databases/mariadb:/var/lib/mysql
      - ./docker/mariadb/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./logs/mariadb:/var/log/mariadb
    networks:
      - localdev_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # PostgreSQL 16+
  # ----------------------------------------------------------------------------
  postgresql:
    image: postgres:16-alpine
    container_name: localdev_postgresql
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${POSTGRES_DB:-localdev_postgres}
      POSTGRES_USER: ${POSTGRES_USER:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    volumes:
      - ./databases/postgresql:/var/lib/postgresql/data
      - ./docker/postgresql/init:/docker-entrypoint-initdb.d:ro
      - ./logs/postgresql:/var/log/postgresql
    networks:
      - localdev_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devuser} -d ${POSTGRES_DB:-localdev_postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # phpMyAdmin (Web Database Admin)
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: localdev_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 128M
      MEMORY_LIMIT: 256M
    volumes:
      - ./docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    depends_on:
      - mysql
      - mariadb
    networks:
      - localdev_net

  # ----------------------------------------------------------------------------
  # Redis Cache & Queue
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: localdev_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./databases/redis:/data
    networks:
      - localdev_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # Node.js & npm Development Environment
  # ----------------------------------------------------------------------------
  node:
    image: node:20-alpine
    container_name: localdev_node
    restart: unless-stopped
    working_dir: /var/www/html
    user: "${PUID:-501}:${PGID:-20}"
    volumes:
      - ./htdocs:/var/www/html
    command: ["sh", "-c", "tail -f /dev/null"]
    networks:
      - localdev_net

  # ----------------------------------------------------------------------------
  # Nginx (Optional profile)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: localdev_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./htdocs:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    profiles:
      - nginx
    networks:
      - localdev_net

networks:
  localdev_net:
    name: localdev_net
    driver: bridge
