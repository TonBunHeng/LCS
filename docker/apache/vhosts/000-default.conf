<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1
    DocumentRoot "/var/www/dashboard"

    <Directory "/var/www/dashboard">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Alias /htdocs to /var/www/html (XAMPP-style access)
    Alias /htdocs "/var/www/html"

    <Directory "/var/www/html">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted

        <FilesMatch "\.php$">
            SetHandler "proxy:fcgi://php:9000"
        </FilesMatch>

        IndexOptions FancyIndexing HTMLTable VersionSort FoldersFirst NameWidth=* DescriptionWidth=*
        IndexIgnore .git .gitignore .gitkeep .DS_Store
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://php:9000"
    </FilesMatch>

    # Rewrite: also allow direct http://localhost/<project>/<file> like in XAMPP
    RewriteEngine On

    # Automatically redirect Laravel / modern projects with public/ directory
    RewriteCond %{REQUEST_URI} ^/htdocs/([a-zA-Z0-9_-]+)/?$
    RewriteCond /var/www/html/%1/public/index.php -f
    RewriteRule ^/htdocs/([a-zA-Z0-9_-]+)/?$ /htdocs/$1/public/ [R=302,L]

    RewriteCond %{REQUEST_URI} !^/htdocs(/.*)?$
    RewriteCond %{REQUEST_URI} !^/$
    RewriteCond %{REQUEST_URI} !^/index\.php$
    RewriteCond /var/www/html%{REQUEST_URI} -d [OR]
    RewriteCond /var/www/html%{REQUEST_URI} -f
    RewriteRule ^/(.*)$ /htdocs/$1 [PT,L]

    DirectoryIndex index.php index.html

    ErrorLog "/var/log/apache2/dashboard-error.log"
    CustomLog "/var/log/apache2/dashboard-access.log" combined
</VirtualHost>
